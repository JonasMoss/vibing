<svg class="diagram" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bar chart. Version control used by professional developers, Stack Overflow survey 2022: Git 96.7 percent, SVN 6.0 percent, none 1.4 percent, Mercurial 1.2 percent.">
