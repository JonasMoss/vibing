</g>
<g class="fragment" data-fragment-index="2">
<polyline points="760,140 760,230 140,230 140,148" fill="none" stroke="#17201f" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#rt-a)"/>
<text x="450" y="274" text-anchor="middle" font-size="24" font-weight="800" fill="#17201f">Not the same?</text><text x="450" y="306" text-anchor="middle" font-size="21" fill="#5c6763">Ask what's missing, fix the README, run the test again.</text>
