<svg class="diagram" viewBox="0 0 1200 330" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your folder goes to a fresh agent after /clear, like a new co-author, which reruns everything from scratch. Same numbers: done. Not the same: ask what's missing, fix the README, and run the test again.">
