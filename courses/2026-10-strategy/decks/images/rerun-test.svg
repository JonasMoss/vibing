<rect x="10" y="30" width="260" height="110" rx="14" fill="#fffdf8" stroke="#17201f" stroke-width="3"/><text x="140" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">Your folder</text><text x="140" y="114" text-anchor="middle" font-size="21" fill="#5c6763">README, scripts, data</text>
<line x1="270" y1="85" x2="312" y2="85" stroke="#17201f" stroke-width="4" marker-end="url(#rt-a)"/>
<rect x="320" y="30" width="260" height="110" rx="14" fill="#e8e0d3" stroke="#17201f" stroke-width="3"/><text x="450" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">/clear</text><text x="450" y="114" text-anchor="middle" font-size="21" fill="#5c6763">like a new co-author</text>
<line x1="580" y1="85" x2="622" y2="85" stroke="#17201f" stroke-width="4" marker-end="url(#rt-a)"/>
<rect x="630" y="30" width="260" height="110" rx="14" fill="#fffdf8" stroke="#17201f" stroke-width="3"/><text x="760" y="80" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">Rerun</text><text x="760" y="114" text-anchor="middle" font-size="21" fill="#5c6763">everything, from scratch</text>
<g class="fragment" data-fragment-index="1">
<line x1="890" y1="85" x2="932" y2="85" stroke="#f0674d" stroke-width="4" marker-end="url(#rt-c)"/>
