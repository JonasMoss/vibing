<path d="M 272 185 C 330 185, 330 317, 388 317" fill="none" stroke="#17201f" stroke-width="4" marker-end="url(#subagents-i)"/>
<rect x="400" y="285" width="300" height="66" rx="14" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
