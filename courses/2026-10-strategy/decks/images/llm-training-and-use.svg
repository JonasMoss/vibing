<svg class="diagram" viewBox="0 0 1264 340" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Training: pre-training, then feedback, then reinforcement learning. When you use it: thinking.">
<defs><marker id="llm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17201f"/></marker></defs>
<text x="2" y="32" font-size="24" font-weight="800" letter-spacing="2" fill="#5c6763">TRAINING: HOW THE MODEL IS MADE</text>
<rect x="2" y="52" width="296" height="272" rx="18" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
<circle cx="46" cy="104" r="26" fill="#f0674d"/>
<text x="46" y="115" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">1</text>
<text x="86" y="116" font-size="32" font-weight="800" fill="#17201f">Pre-training</text>
<text x="24" y="194" font-size="23" fill="#17201f">Reads the internet</text>
<text x="24" y="234" font-size="23" fill="#17201f">Predicts the next word</text>
<g class="fragment" data-fragment-index="1"><line x1="300" y1="188.0" x2="318" y2="188.0" stroke="#17201f" stroke-width="4" marker-end="url(#llm-arrow)"/><rect x="324" y="52" width="296" height="272" rx="18" fill="#fffdf8" stroke="#17201f" stroke-width="3"/><circle cx="368" cy="104" r="26" fill="#f0674d"/><text x="368" y="115" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">2</text><text x="408" y="116" font-size="32" font-weight="800" fill="#17201f">Feedback</text><text x="346" y="194" font-size="23" fill="#17201f">Learns from examples</text><text x="346" y="234" font-size="23" fill="#17201f">People rank answers</text></g>
<g class="fragment" data-fragment-index="2"><line x1="622" y1="188.0" x2="640" y2="188.0" stroke="#17201f" stroke-width="4" marker-end="url(#llm-arrow)"/><rect x="646" y="52" width="296" height="272" rx="18" fill="#fffdf8" stroke="#17201f" stroke-width="3"/><circle cx="690" cy="104" r="26" fill="#f0674d"/><text x="690" y="115" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">3</text><text x="730" y="116" font-size="32" font-weight="800" fill="#17201f">RL</text><text x="668" y="194" font-size="23" fill="#17201f">Reinforcement learning:</text><text x="668" y="234" font-size="23" fill="#17201f">tries, gets checked,</text><text x="668" y="274" font-size="23" fill="#17201f">rewarded when right</text></g>
<g class="fragment" data-fragment-index="3"><line x1="955.0" y1="8" x2="955.0" y2="332" stroke="#5c6763" stroke-width="3" stroke-dasharray="10 8"/><text x="968" y="32" font-size="24" font-weight="800" letter-spacing="2" fill="#f0674d">WHEN YOU USE IT</text><rect x="968" y="52" width="296" height="272" rx="18" fill="#e8e0d3" stroke="#17201f" stroke-width="3"/><circle cx="1012" cy="104" r="26" fill="#f0674d"/><text x="1012" y="115" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">4</text><text x="1052" y="116" font-size="32" font-weight="800" fill="#17201f">Thinking</text><text x="990" y="194" font-size="23" fill="#17201f">Works it out first</text><text x="990" y="234" font-size="23" fill="#17201f">Longer: better,</text><text x="990" y="274" font-size="23" fill="#17201f">slower, costs more</text></g>
</svg>
