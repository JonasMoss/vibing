<svg class="diagram" viewBox="0 0 1200 410" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A worktree is a second folder for the same git project, on its own branch. Two agents can work at once, one in each folder, and the experiment can be merged back.">
<defs><marker id="worktrees-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17201f"/></marker><marker id="worktrees-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0674d"/></marker></defs>
<rect x="470" y="20" width="260" height="80" rx="14" fill="#e8e0d3" stroke="#17201f" stroke-width="3"/>
<text x="600" y="58" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">.git</text>
<text x="600" y="86" text-anchor="middle" font-size="19" fill="#5c6763">one project's history</text>
<path d="M 520 102 C 480 140, 340 140, 300 168" fill="none" stroke="#17201f" stroke-width="4" marker-end="url(#worktrees-i)"/>
<path d="M 680 102 C 720 140, 860 140, 900 168" fill="none" stroke="#17201f" stroke-width="4" marker-end="url(#worktrees-i)"/>
<rect x="110" y="175" width="380" height="130" rx="14" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
<text x="300" y="222" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">paper/</text>
<text x="300" y="256" text-anchor="middle" font-size="21" fill="#5c6763">branch: main</text>
<text x="300" y="286" text-anchor="middle" font-size="21" fill="#17201f">agent 1 works here</text>
<rect x="710" y="175" width="380" height="130" rx="14" fill="#fbd9d1" stroke="#17201f" stroke-width="3"/>
<text x="900" y="222" text-anchor="middle" font-size="28" font-weight="800" fill="#17201f">paper-experiment/</text>
<text x="900" y="256" text-anchor="middle" font-size="21" fill="#5c6763">branch: experiment</text>
<text x="900" y="286" text-anchor="middle" font-size="21" fill="#17201f">agent 2 works here</text>
<path d="M 710 280 C 640 330, 560 330, 492 280" fill="none" stroke="#f0674d" stroke-width="4" marker-end="url(#worktrees-c)"/>
<text x="600" y="352" text-anchor="middle" font-size="21" fill="#b8432d">merge it back, if you like it</text>
<text x="600" y="392" text-anchor="middle" font-size="21" fill="#5c6763">Two folders, one project: two agents at once, without touching each other's files.</text>
</svg>
