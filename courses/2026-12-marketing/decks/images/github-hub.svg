<svg class="diagram" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GitHub in the middle, with four uses: backup, co-authors, a replication package with a DOI through Zenodo, and a free web page with GitHub Pages.">
