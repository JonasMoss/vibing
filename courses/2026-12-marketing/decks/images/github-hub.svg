<text x="1010" y="60" text-anchor="middle" font-size="27" font-weight="800" fill="#17201f">Replication package</text>
<text x="1010" y="92" text-anchor="middle" font-size="21" fill="#5c6763">a DOI through Zenodo</text>
<rect x="860" y="270" width="300" height="90" rx="16" fill="#fffdf8" stroke="#f0674d" stroke-width="4"/>
<text x="1010" y="310" text-anchor="middle" font-size="27" font-weight="800" fill="#17201f">A web page</text>
<text x="1010" y="342" text-anchor="middle" font-size="21" fill="#5c6763">GitHub Pages, free</text>
<rect x="470" y="140" width="260" height="100" rx="18" fill="#e8e0d3" stroke="#17201f" stroke-width="3"/>
