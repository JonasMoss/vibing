<rect x="40" y="20" width="300" height="90" rx="16" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
<text x="190" y="60" text-anchor="middle" font-size="27" font-weight="800" fill="#17201f">Backup</text>
<text x="190" y="92" text-anchor="middle" font-size="21" fill="#5c6763">laptop dead? clone it back</text>
<rect x="40" y="270" width="300" height="90" rx="16" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
