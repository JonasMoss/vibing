<svg class="diagram" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Your laptop on the left and GitHub, the remote, in the middle: push sends your commits to GitHub, pull fetches new ones. Then a co-author's laptop on the right, pushing and pulling to the same GitHub repository.">
<defs><marker id="remote-push" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0674d"/></marker><marker id="remote-pull" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17201f"/></marker></defs>
<rect x="30" y="70" width="260" height="150" rx="18" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
<text x="160" y="122" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">Your laptop</text>
<line x1="75" y1="172" x2="245" y2="172" stroke="#17201f" stroke-width="4"/>
<circle cx="95" cy="172" r="12" fill="#17201f"/><circle cx="160" cy="172" r="12" fill="#17201f"/><circle cx="225" cy="172" r="12" fill="#17201f"/>
<rect x="470" y="70" width="260" height="150" rx="18" fill="#e8e0d3" stroke="#17201f" stroke-width="3"/>
<text x="600" y="137" text-anchor="middle" font-size="36" font-weight="800" fill="#17201f">GitHub</text>
<text x="600" y="177" text-anchor="middle" font-size="24" fill="#5c6763">the remote</text>
<line x1="302" y1="118" x2="458" y2="118" stroke="#f0674d" stroke-width="5" marker-end="url(#remote-push)"/>
<text x="380" y="102" text-anchor="middle" font-size="26" font-weight="800" fill="#f0674d">push</text>
<line x1="458" y1="172" x2="302" y2="172" stroke="#17201f" stroke-width="5" marker-end="url(#remote-pull)"/>
<text x="380" y="212" text-anchor="middle" font-size="26" font-weight="800" fill="#17201f">pull</text>
<g class="fragment" data-fragment-index="1">
<rect x="910" y="70" width="260" height="150" rx="18" fill="#fffdf8" stroke="#17201f" stroke-width="3"/>
<text x="1040" y="122" text-anchor="middle" font-size="30" font-weight="800" fill="#17201f">Co-author</text>
<line x1="955" y1="172" x2="1125" y2="172" stroke="#17201f" stroke-width="4"/>
<circle cx="975" cy="172" r="12" fill="#17201f"/><circle cx="1040" cy="172" r="12" fill="#17201f"/><circle cx="1105" cy="172" r="12" fill="#17201f"/>
<line x1="898" y1="118" x2="742" y2="118" stroke="#f0674d" stroke-width="5" marker-end="url(#remote-push)"/>
<text x="820" y="102" text-anchor="middle" font-size="26" font-weight="800" fill="#f0674d">push</text>
<line x1="742" y1="172" x2="898" y2="172" stroke="#17201f" stroke-width="5" marker-end="url(#remote-pull)"/>
<text x="820" y="212" text-anchor="middle" font-size="26" font-weight="800" fill="#17201f">pull</text>
<text x="600" y="282" text-anchor="middle" font-size="24" fill="#5c6763">The same history in all three places.</text>
</g>
</svg>
