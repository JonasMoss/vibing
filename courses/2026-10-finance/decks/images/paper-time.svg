<svg class="diagram" viewBox="0 0 1200 330" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Where your time goes. The usual way: weeks of reading, then a little judging. With the agent: one minute of reading, ten minutes for a fix, and most of your time judging.">
